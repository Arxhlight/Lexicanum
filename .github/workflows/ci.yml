name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lexicanum.sln

      - name: Verify formatting
        run: dotnet format Lexicanum.sln --verify-no-changes --no-restore

      - name: Build (analyzers + style enforced, warnings are errors)
        run: dotnet build Lexicanum.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Lexicanum.sln --configuration Release --no-build --verbosity normal
