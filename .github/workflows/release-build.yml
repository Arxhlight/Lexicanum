name: Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lexicanum.sln

      - name: Build
        run: dotnet build Lexicanum.sln --configuration Release --no-restore

      - name: Test the merge commit before publishing
        run: dotnet test Lexicanum.sln --configuration Release --no-build

      - name: Publish single-file executable
        run: >
          dotnet publish src/Lexicanum/Lexicanum.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexicanum-${{ github.run_number }}
          path: ./publish/Lexicanum.exe
